# #159: FlowBench の -rd の a を変えた trace（-fd 1 1、b=1、seed 1〜3）で、#152 と同じ構成の MPLC・VPLC を回す。実 trace は回さない。
# -fd を変えても VPLC と VPLC ideal のミス率が重なったまま（final_entry_flowbench_fd_8way.toml）だったので、rd でも同じかを見る。
# rd の a を上げると packet が多くの prefix に散り、/24 の packet share も上がる（#115）。総 entry 数は 4K〜64K だけ。
# banana で実行する: researchctl run ~/yuzugon/worktrees/osada-issue159/scripts/experiments/final_entry_flowbench_rd_8way.toml
name = "final-entry-flowbench-rd-8way"
issue = 159
note = "#159 FlowBench の -rd の a（0.6・0.8・0.9・1.0、fd 1 1、seed 1〜3）で #152 と同じ総 entry 数 4K〜64K の掃引（8-way、VPLC /1〜/32、ideal-entry）"
cwd = "/home/tsuji/yuzugon/worktrees/osada-issue159"
inputs = [
  "scripts/experiments/no_real_traces.tsv",
  "/home/tsuji/yuzugon/rules/rib.20260327.0600.unique.rule",
]
outputs = ["out/final_entry_flowbench_rd_8way"]

[env]
GOTOOLCHAIN = "go1.26.1"
GO = "/usr/local/go/bin/go"
WAY = "8"
TAG_LENGTH = "1-32"
IDEAL_TYPE = "50"
FB_FD = "1 1"
CAPACITIES = "4096 8192 16384 32768 65536"

[[steps]]
name = "sweep-rd0.6-1"
argv = [
  "env", "FB_RD=0.6 1",
  "bash", "scripts/run_final_entry_sweep.sh",
  "scripts/experiments/no_real_traces.tsv",
  "/home/tsuji/yuzugon/tools/Flow-Bench",
  "/home/tsuji/yuzugon/rules/rib.20260327.0600.unique.rule",
  "out/final_entry_flowbench_rd_8way/rd0.6-1",
  "8",
]

[[steps]]
name = "sweep-rd0.8-1"
argv = [
  "env", "FB_RD=0.8 1",
  "bash", "scripts/run_final_entry_sweep.sh",
  "scripts/experiments/no_real_traces.tsv",
  "/home/tsuji/yuzugon/tools/Flow-Bench",
  "/home/tsuji/yuzugon/rules/rib.20260327.0600.unique.rule",
  "out/final_entry_flowbench_rd_8way/rd0.8-1",
  "8",
]

[[steps]]
name = "sweep-rd0.9-1"
argv = [
  "env", "FB_RD=0.9 1",
  "bash", "scripts/run_final_entry_sweep.sh",
  "scripts/experiments/no_real_traces.tsv",
  "/home/tsuji/yuzugon/tools/Flow-Bench",
  "/home/tsuji/yuzugon/rules/rib.20260327.0600.unique.rule",
  "out/final_entry_flowbench_rd_8way/rd0.9-1",
  "8",
]

[[steps]]
name = "sweep-rd1.0-1"
argv = [
  "env", "FB_RD=1.0 1",
  "bash", "scripts/run_final_entry_sweep.sh",
  "scripts/experiments/no_real_traces.tsv",
  "/home/tsuji/yuzugon/tools/Flow-Bench",
  "/home/tsuji/yuzugon/rules/rib.20260327.0600.unique.rule",
  "out/final_entry_flowbench_rd_8way/rd1.0-1",
  "8",
]
